# Process the Games.Database contribution queue
#
# The launcher submits ROM games and Steam library games as small JSON files in
#   Games.Database/Queue/Games/{Platform}/{hash}.json
# This workflow runs every 4 hours and runs .github/scripts/process_db_queue.py, which
# for each item:
#   - checks {Platform}.Games.json (created if the platform is new) by store id, fuzzy
#     title ("The Witcher 3" = "Witcher 3") and TitleID
#   - when the game is missing or has empty metadata, asks a provider (Steam store API for
#     Steam games, Wikipedia for everything else); only games a provider confirms as real
#     are added, unconfirmed ones are retried a few runs and then dropped
#   - merges the same game from several stores into one entry (`stores` list) and fills
#     EMPTY Description / StorePageUrl / TitleID / appid / image fields (never overwrites)
#   - merges duplicates already in the database (same normalised title, or subtitle variants
#     confirmed by a Wikipedia redirect); entries with different TitleIDs/appids stay separate
# Processed queue files are deleted and a single commit is pushed. Running in CI serialises
# writes from many launchers and avoids SHA-conflict failures.
#
# Required secret:
#   GAMES_DB_TOKEN  – fine-grained PAT with Contents: Read and write on
#                     Koriebonx98/Games.Database.

name: Process Games Database Queue

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-db-queue
  cancel-in-progress: false

jobs:
  process:
    name: Merge queued games into platform databases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (queue script)
        uses: actions/checkout@v4

      - name: Check for GAMES_DB_TOKEN
        env:
          GAMES_DB_TOKEN: ${{ secrets.GAMES_DB_TOKEN }}
        run: |
          if [ -z "$GAMES_DB_TOKEN" ]; then
            echo "❌ GAMES_DB_TOKEN secret is not set."
            exit 1
          fi

      - name: Clone Games.Database
        env:
          GAMES_DB_TOKEN: ${{ secrets.GAMES_DB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GAMES_DB_TOKEN}@github.com/Koriebonx98/Games.Database.git" db

      - name: Process queue (check database, run providers, merge)
        working-directory: db
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/process_db_queue.py"

      - name: Commit and push
        working-directory: db
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️  No changes to commit."
            exit 0
          fi
          git config user.name  "Game.OS Admin"
          git config user.email "admin@gameos.local"
          git add -A
          git commit -m "Process queue: ${SUMMARY:-update}"
          git pull --rebase origin main
          git push origin HEAD:main
