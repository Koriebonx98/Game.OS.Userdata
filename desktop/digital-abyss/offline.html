<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Abyss</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
        button { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 10px; background: #6366f1; color: #fff; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <h2>Can't reach Game OS</h2>
        <p>Connect to the internet to verify your Game OS account and license.</p>
        <button id="retry">Retry</button>
    </div>
    <script>
        const retry = new URLSearchParams(location.search).get('retry');
        document.getElementById('retry').onclick = () => { location.href = retry; };
    </script>
</body>
</html>
