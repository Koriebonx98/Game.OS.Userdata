<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Game OS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Game OS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <script src="pwa.js"></script>
</head>
<body class="app-body">
    <header class="app-header">
        <h1>🎮 Game OS</h1>
        <span id="appUser" class="app-user"></span>
    </header>

    <main class="app-main">
        <section id="view-home" class="app-view">
            <div class="app-stats">
                <div class="app-stat"><b id="statGames">0</b><span>Games</span></div>
                <div class="app-stat"><b id="statFavs">0</b><span>Favourites</span></div>
                <div class="app-stat"><b id="statPlaytime">0h</b><span>Playtime</span></div>
                <div class="app-stat"><b id="statAch">0</b><span>Achievements</span></div>
            </div>
            <h2 class="app-h2">Recently added</h2>
            <div id="recentList" class="app-list"></div>
        </section>
        <section id="view-library" class="app-view" hidden>
            <input id="libSearch" class="app-search" type="search" placeholder="Search your library…">
            <div id="libList" class="app-list"></div>
        </section>
        <section id="view-favourites" class="app-view" hidden>
            <div id="favList" class="app-list"></div>
        </section>
        <section id="view-chats" class="app-view" hidden>
            <div id="chatList" class="app-list"></div>
            <div id="chatPane" class="app-chat" hidden>
                <div class="app-chat-head"><button id="chatBack" class="app-fav">‹</button><b id="chatWith"></b></div>
                <div id="chatMsgs" class="app-chat-msgs"></div>
                <form id="chatForm" class="app-chat-form"><input id="chatInput" type="text" placeholder="Message…" autocomplete="off"><button class="btn" type="submit">Send</button></form>
            </div>
        </section>
        <section id="view-alerts" class="app-view" hidden>
            <div id="notifBox" class="app-card"></div>
            <div id="alertList" class="app-list"></div>
        </section>
    </main>

    <nav class="app-tabbar">
        <button data-view="home" class="active"><span>🏠</span>Home</button>
        <button data-view="library"><span>📚</span>Library</button>
        <button data-view="favourites"><span>❤️</span>Favourites</button>
        <button data-view="chats"><span>💬</span>Chats<i id="chatBadge" hidden></i></button>
        <button data-view="alerts"><span>🔔</span>Alerts<i id="alertBadge" hidden></i></button>
    </nav>

    <script src="script.js"></script>
    <script>
    (function () {
        const $ = id => document.getElementById(id);
        const esc = s => escapeHtml(String(s == null ? '' : s));
        let user = null, library = [];

        function fmtPlaytime(min) {
            const h = Math.floor(min / 60);
            return h >= 1 ? h + 'h' : min + 'm';
        }
        function minutesOf(g) {
            if (typeof g.playtimeMinutes === 'number') return g.playtimeMinutes;
            if (typeof g.playtime === 'number') return g.playtime;
            return 0;
        }
        function achOf(g) {
            const a = g.achievementsUnlocked != null ? g.achievementsUnlocked : g.achievements;
            return typeof a === 'number' ? a : (Array.isArray(a) ? a.length : 0);
        }
        function row(g, extra) {
            const cover = g.coverUrl
                ? `<img src="${esc(g.coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">`
                : `<span>${esc(getPlatformIcon(g.platform || ''))}</span>`;
            const pt = minutesOf(g), ac = achOf(g);
            return `<div class="app-row"><div class="app-cover">${cover}</div>
                <div class="app-row-info"><b>${esc(g.title)}</b>
                <small>${esc(g.platform)}${pt ? ' · ⏱ ' + fmtPlaytime(pt) : ''}${ac ? ' · 🏆 ' + ac : ''}</small></div>${extra || ''}</div>`;
        }
        function empty(msg) { return `<p class="games-list-empty">${msg}</p>`; }

        function renderLibrary() {
            const q = $('libSearch').value.trim().toLowerCase();
            const list = library.filter(g => (g.title || '').toLowerCase().includes(q))
                .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            $('libList').innerHTML = list.length ? list.map(g => {
                const fav = typeof window !== 'undefined' && typeof window.isFavourite === 'function'
                ? window.isFavourite(user.username, g.platform, g.title)
                : false;
                return row(g, `<button class="app-fav" data-p="${esc(g.platform)}" data-t="${esc(g.title)}">${fav ? '❤️' : '🤍'}</button>`);
            }).join('') : empty('No games found.');
        }
        function renderFavs() {
            const favs = getFavourites(user.username);
            $('favList').innerHTML = favs.length ? favs.map(g =>
                row(g, `<button class="app-fav" data-p="${esc(g.platform)}" data-t="${esc(g.title)}">❤️</button>`)).join('')
                : empty('No favourites yet. Tap 🤍 on a game in your library.');
            $('statFavs').textContent = favs.length;
        }
        function renderHome() {
            $('statGames').textContent = library.length;
            $('statPlaytime').textContent = fmtPlaytime(library.reduce((n, g) => n + minutesOf(g), 0));
            $('statAch').textContent = library.reduce((n, g) => n + achOf(g), 0);
            const recent = [...library].sort((a, b) => (b.addedAt || '').localeCompare(a.addedAt || '')).slice(0, 5);
            $('recentList').innerHTML = recent.length ? recent.map(g => row(g)).join('') : empty('Your library is empty.');
        }
        function renderAll() { renderHome(); renderLibrary(); renderFavs(); }

        // ── Notifications (friend requests, messages, achievements) ──
        let seenKey, friends = [], alertItems = [];
        const store = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
        function notify(title, body, url) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const o = { body, icon: 'icons/icon-192.png', data: { url: url || 'app.html' } };
            if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, o));
            else new Notification(title, o);
        }
        const nameOf = f => typeof f === 'string' ? f : (f.username || f.name || f.from || '');
        async function loadFriends() {
            try { friends = (MODE === 'demo' ? getDemoFriends(user.username) : await getFriendsGitHub(user.username)).map(nameOf).filter(Boolean); } catch (_) {}
        }
        async function fetchMsgs(f) {
            const r = MODE === 'demo' ? await getMessagesDemo(user.username, f) : await getMessagesGitHub(user.username, f);
            return r.messages || [];
        }
        async function pollAlerts(push) {
            try {
                const items = [];
                const seen = store(seenKey) || {};
                const next = { req: [], msg: {}, ach: seen.ach };
                const fresh = [];
                // friend requests
                const reqs = (MODE === 'demo' ? getDemoFriendRequests(user.username) : await getFriendRequestsGitHub(user.username)) || [];
                reqs.map(nameOf).forEach(n => {
                    items.push({ icon: '👥', t: n, s: 'sent you a friend request' });
                    next.req.push(n);
                    if (!(seen.req || []).includes(n)) fresh.push(['Friend request', n + ' sent you a friend request', 'app.html']);
                });
                // messages
                let unreadTotal = 0;
                const unread = {};
                for (const f of friends) {
                    const msgs = await fetchMsgs(f).catch(() => []);
                    const incoming = msgs.filter(m => (m.from || '').toLowerCase() !== user.username.toLowerCase());
                    const lastRead = getLastRead(user.username, f);
                    const n = incoming.filter(m => !lastRead || m.sentAt > lastRead).length;
                    unread[f] = { n, last: msgs[msgs.length - 1] };
                    unreadTotal += n;
                    next.msg[f] = incoming.length;
                    if (n && seen.msg && incoming.length > (seen.msg[f] || 0)) {
                        const m = incoming[incoming.length - 1];
                        fresh.push(['💬 ' + f, m.text, 'app.html#chats']);
                    }
                    if (n) items.push({ icon: '💬', t: f, s: n + ' unread message' + (n > 1 ? 's' : '') });
                }
                // achievements
                const total = library.reduce((n, g) => n + achOf(g), 0);
                next.ach = total;
                if (seen.ach != null && total > seen.ach) {
                    const d = total - seen.ach;
                    fresh.push(['🏆 Achievement unlocked', d + ' new achievement' + (d > 1 ? 's' : '') + ' earned', 'app.html']);
                    items.unshift({ icon: '🏆', t: 'Achievement unlocked', s: d + ' new achievement' + (d > 1 ? 's' : '') });
                }
                store(seenKey, next);
                alertItems = items; renderChats(unread);
                $('alertList').innerHTML = items.length ? items.map(i => `<div class="app-row"><div class="app-cover"><span>${i.icon}</span></div><div class="app-row-info"><b>${esc(i.t)}</b><small>${esc(i.s)}</small></div></div>`).join('') : empty('No new alerts.');
                const badge = $('alertBadge'); badge.hidden = !items.length; badge.textContent = items.length;
                const cb = $('chatBadge'); cb.hidden = !unreadTotal; cb.textContent = unreadTotal;
                if (push) fresh.forEach(f => notify(f[0], f[1], f[2]));
            } catch (_) {}
        }
        function renderChats(unread) {
            $('chatList').innerHTML = friends.length ? friends.map(f => {
                const u = (unread && unread[f]) || {};
                return `<div class="app-row app-chat-row" data-f="${esc(f)}"><div class="app-cover"><span>👤</span></div><div class="app-row-info"><b>${esc(f)}</b><small>${esc(u.last ? u.last.text : 'Say hi!')}</small></div>${u.n ? `<span class="app-pill">${u.n}</span>` : ''}</div>`;
            }).join('') : empty('Add friends on the site to start chatting.');
        }
        let chatFriend = null;
        async function openChat(f) {
            chatFriend = f;
            $('chatList').hidden = true; $('chatPane').hidden = false; $('chatWith').textContent = f;
            const msgs = await fetchMsgs(f).catch(() => []);
            $('chatMsgs').innerHTML = msgs.map(m => `<div class="app-bubble ${(m.from || '').toLowerCase() === user.username.toLowerCase() ? 'me' : ''}">${esc(m.text)}</div>`).join('') || empty('No messages yet.');
            $('chatMsgs').scrollTop = 1e9;
            markConversationRead(user.username, f);
            pollAlerts(false);
        }
        async function sendChat(e) {
            e.preventDefault();
            const text = $('chatInput').value.trim();
            if (!text || !chatFriend) return;
            $('chatInput').value = '';
            if (MODE === 'demo') await sendMessageDemo(user.username, chatFriend, text);
            else await sendMessageGitHub(user.username, chatFriend, text);
            openChat(chatFriend);
        }
        function renderNotifBox() {
            const box = $('notifBox');
            if (!('Notification' in window)) {
                box.innerHTML = '<p>Live notifications need iOS 16.4+ with Game OS added to your Home Screen.</p>';
            } else if (Notification.permission === 'granted') {
                box.innerHTML = '<p>🔔 Live notifications are on.</p>';
            } else if (Notification.permission === 'denied') {
                box.innerHTML = '<p>Notifications are blocked. Enable them in Settings.</p>';
            } else {
                box.innerHTML = '<button class="btn" id="enableNotif">Enable notifications</button>';
                $('enableNotif').onclick = () => Notification.requestPermission().then(renderNotifBox);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try { await modeReady; } catch (_) {}
            user = isLoggedIn() ? getCurrentUser() : null;
            if (!user) { location.replace('login.html'); return; }
            seenKey = 'gameOS_seen_alerts_' + user.username.toLowerCase();
            $('appUser').textContent = user.username;
            try {
                library = MODE === 'demo' ? getDemoGameLibrary(user.username) : await getGameLibraryGitHub(user.username);
            } catch (_) { library = []; }
            renderAll(); renderNotifBox();
            await loadFriends(); renderChats();
            pollAlerts(false);
            $('chatList').addEventListener('click', e => { const r = e.target.closest('.app-chat-row'); if (r) openChat(r.dataset.f); });
            $('chatBack').onclick = () => { chatFriend = null; $('chatPane').hidden = true; $('chatList').hidden = false; };
            $('chatForm').addEventListener('submit', sendChat);
            setInterval(() => pollAlerts(true), 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) pollAlerts(true); });

            document.querySelectorAll('.app-tabbar button').forEach(b => b.onclick = () => {
                document.querySelectorAll('.app-tabbar button').forEach(x => x.classList.toggle('active', x === b));
                document.querySelectorAll('.app-view').forEach(v => v.hidden = v.id !== 'view-' + b.dataset.view);
                window.scrollTo(0, 0);
            });
            $('libSearch').addEventListener('input', renderLibrary);
            document.querySelector('.app-main').addEventListener('click', e => {
                const b = e.target.closest('.app-fav');
                if (!b) return;
                toggleFavourite(user.username, { title: b.dataset.t, coverUrl: (library.find(g => g.title === b.dataset.t && g.platform === b.dataset.p) || {}).coverUrl }, b.dataset.p);
                renderAll();
            });
        });
    })();
    </script>
</body>
</html>
