<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Game OS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Game OS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <script src="pwa.js"></script>
</head>
<body class="app-body">
    <header class="app-header">
        <h1>🎮 Game OS</h1>
        <span id="appUser" class="app-user"></span>
    </header>

    <main class="app-main">
        <section id="view-home" class="app-view">
            <div class="app-stats">
                <div class="app-stat"><b id="statGames">0</b><span>Games</span></div>
                <div class="app-stat"><b id="statFavs">0</b><span>Favourites</span></div>
                <div class="app-stat"><b id="statPlaytime">0h</b><span>Playtime</span></div>
                <div class="app-stat"><b id="statAch">0</b><span>Achievements</span></div>
            </div>
            <h2 class="app-h2">Recently added</h2>
            <div id="recentList" class="app-list"></div>
        </section>
        <section id="view-library" class="app-view" hidden>
            <input id="libSearch" class="app-search" type="search" placeholder="Search your library…">
            <div class="app-filters">
                <select id="libPlatform" aria-label="Platform"><option value="">All platforms</option></select>
                <select id="libSort" aria-label="Sort">
                    <option value="name">Name</option>
                    <option value="playtime">Most playtime</option>
                    <option value="achievements">Most achievements</option>
                    <option value="recent">Recently added</option>
                </select>
                <select id="libShow" aria-label="Show">
                    <option value="">All games</option>
                    <option value="played">Played</option>
                    <option value="unplayed">Not played</option>
                    <option value="ach">With achievements</option>
                    <option value="fav">Favourites</option>
                </select>
            </div>
            <div id="libCount" class="app-count"></div>
            <div id="libGroups" class="app-chips"></div>
            <div id="libList" class="app-list"></div>
        </section>
        <section id="view-favourites" class="app-view" hidden>
            <div id="favList" class="app-list"></div>
        </section>
        <section id="view-friends" class="app-view" hidden>
            <div id="friendList" class="app-list"></div>
        </section>
        <section id="view-chats" class="app-view" hidden>
            <div id="chatList" class="app-list"></div>
            <div id="chatPane" class="app-chat" hidden>
                <div class="app-chat-head"><button id="chatBack" class="app-fav">‹</button><b id="chatWith"></b></div>
                <div id="chatMsgs" class="app-chat-msgs"></div>
                <form id="chatForm" class="app-chat-form"><input id="chatInput" type="text" placeholder="Message…" autocomplete="off"><button class="btn" type="submit">Send</button></form>
            </div>
        </section>
        <section id="view-alerts" class="app-view" hidden>
            <div id="notifBox" class="app-card"></div>
            <div id="alertList" class="app-list"></div>
        </section>
    </main>

    <div id="gameDetail" class="app-detail" hidden>
        <div class="app-detail-bar"><button id="detailBack">‹ Back</button></div>
        <div id="detailBody" class="app-detail-body"></div>
    </div>
    <div id="achSheet" class="app-sheet" hidden>
        <div class="app-sheet-box">
            <div class="app-sheet-head"><b id="achSheetTitle">Achievements</b><button id="achSheetClose" aria-label="Close">✕</button></div>
            <div id="achSheetBody" class="app-sheet-body"></div>
        </div>
    </div>

    <nav class="app-tabbar">
        <button data-view="home" class="active"><span>🏠</span>Home</button>
        <button data-view="library"><span>📚</span>Library</button>
        <button data-view="favourites"><span>❤️</span>Favourites</button>
        <button data-view="friends"><span>👥</span>Friends</button>
        <button data-view="chats"><span>💬</span>Chats<i id="chatBadge" hidden></i></button>
        <button data-view="alerts"><span>🔔</span>Alerts<i id="alertBadge" hidden></i></button>
    </nav>

    <script src="script.js"></script>
    <script>
    (function () {
        const $ = id => document.getElementById(id);
        const esc = s => escapeHtml(String(s == null ? '' : s));
        let user = null, library = [], userAch = null;

        function fmtPlaytime(min) {
            const h = Math.floor(min / 60);
            return h >= 1 ? h + 'h' : min + 'm';
        }
        function minutesOf(g) {
            if (typeof g.playtimeMinutes === 'number') return g.playtimeMinutes;
            if (typeof g.playtime === 'number') return g.playtime;
            return 0;
        }
        const isUnlocked = a => a && a.unlockedAt && !String(a.unlockedAt).startsWith('1970-01-01');
        const sameGame = (a, g) => String(a.gameTitle || '').toLowerCase() === String(g.title || '').toLowerCase()
            && (!a.platform || !g.platform || String(a.platform).toLowerCase() === String(g.platform).toLowerCase());
        async function loadUserAch() {
            try {
                const f = MODE === 'demo' ? null : await githubRead('accounts/' + user.username.toLowerCase() + '/achievements.json');
                userAch = f && Array.isArray(f.content) ? f.content.filter(isUnlocked) : null;
            } catch (_) { userAch = null; }
        }
        function achOf(g) {
            if (userAch) { const n = userAch.filter(a => sameGame(a, g)).length; if (n) return n; }
            return achBase(g);
        }
        function achBase(g) {
            const a = g.achievementsUnlocked != null ? g.achievementsUnlocked : g.achievements;
            return typeof a === 'number' ? a : (Array.isArray(a) ? a.length : 0);
        }
        function row(g, extra) {
            const cover = g.coverUrl
                ? `<img src="${esc(g.coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">`
                : `<span>${esc(getPlatformIcon(g.platform || ''))}</span>`;
            const pt = minutesOf(g), ac = achOf(g);
            return `<div class="app-row" ${g.title && g.platform != null && !g._noOpen ? `data-open-p="${esc(g.platform)}" data-open-t="${esc(g.title)}"` : ''}><div class="app-cover">${cover}</div>
                <div class="app-row-info"><b>${esc(g.title)}</b>
                <small>${esc(g.platform)}${pt ? ' · ⏱ ' + fmtPlaytime(pt) : ''}${ac ? ' · 🏆 ' + ac : ''}</small></div>${extra || ''}</div>`;
        }
        function empty(msg) { return `<p class="games-list-empty">${msg}</p>`; }

        let libPlatform = '', libSort = 'name', libShow = '';
        function fillPlatforms() {
            const sel = $('libPlatform'), cur = sel.value;
            const plats = [...new Set(library.map(g => g.platform).filter(Boolean))].sort();
            sel.innerHTML = '<option value="">All platforms</option>' + plats.map(p => `<option value="${esc(p)}">${esc(getPlatformIcon(p))} ${esc(p)} (${library.filter(g => g.platform === p).length})</option>`).join('');
            sel.value = plats.includes(cur) ? cur : '';
        }
        function renderLibrary() {
            const q = $('libSearch').value.trim().toLowerCase();
            libPlatform = $('libPlatform').value; libSort = $('libSort').value; libShow = $('libShow').value;
            const isFav = g => typeof window.isFavourite === 'function' && window.isFavourite(user.username, g.platform, g.title);
            let list = library.filter(g => (g.title || '').toLowerCase().includes(q)
                && (!libPlatform || g.platform === libPlatform)
                && (libShow === '' || (libShow === 'played' && minutesOf(g) > 0) || (libShow === 'unplayed' && !minutesOf(g))
                    || (libShow === 'ach' && achOf(g) > 0) || (libShow === 'fav' && isFav(g))));
            const cmp = {
                name: (a, b) => (a.title || '').localeCompare(b.title || ''),
                playtime: (a, b) => minutesOf(b) - minutesOf(a) || (a.title || '').localeCompare(b.title || ''),
                achievements: (a, b) => achOf(b) - achOf(a) || (a.title || '').localeCompare(b.title || ''),
                recent: (a, b) => (b.addedAt || '').localeCompare(a.addedAt || '')
            }[libSort];
            list.sort(cmp);
            $('libCount').textContent = list.length + ' game' + (list.length === 1 ? '' : 's') + ' · ⏱ ' + fmtPlaytime(list.reduce((n, g) => n + minutesOf(g), 0)) + ' · 🏆 ' + list.reduce((n, g) => n + achOf(g), 0);
            const plats = [...new Set(library.map(g => g.platform).filter(Boolean))].sort();
            $('libGroups').innerHTML = plats.length > 1 ? ['', ...plats].map(p => `<button class="app-chip ${p === libPlatform ? 'active' : ''}" data-plat="${esc(p)}">${p ? esc(p) : 'All'}</button>`).join('') : '';
            $('libList').innerHTML = list.length ? list.map(g =>
                row(g, `<button class="app-fav" data-p="${esc(g.platform)}" data-t="${esc(g.title)}">${isFav(g) ? '❤️' : '🤍'}</button>`)).join('') : empty('No games found.');
        }
        function renderFavs() {
            const favs = getFavourites(user.username);
            $('favList').innerHTML = favs.length ? favs.map(g =>
                row(g, `<button class="app-fav" data-p="${esc(g.platform)}" data-t="${esc(g.title)}">❤️</button>`)).join('')
                : empty('No favourites yet. Tap 🤍 on a game in your library.');
            $('statFavs').textContent = favs.length;
        }
        function renderHome() {
            $('statGames').textContent = library.length;
            $('statPlaytime').textContent = fmtPlaytime(library.reduce((n, g) => n + minutesOf(g), 0));
            $('statAch').textContent = userAch ? Math.max(userAch.length, 0) : library.reduce((n, g) => n + achBase(g), 0);
            const recent = [...library].sort((a, b) => (b.addedAt || '').localeCompare(a.addedAt || '')).slice(0, 5);
            $('recentList').innerHTML = recent.length ? recent.map(g => row(g)).join('') : empty('Your library is empty.');
        }
        function findGame(p, t) { return library.find(g => g.title === t && g.platform === p); }
        const asDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); };
        async function loadGameAchievements(g) {
            let tpl = [];
            if (g.achievementsUrl && /^https:\/\//i.test(g.achievementsUrl)) {
                try {
                    const r = await fetch(g.achievementsUrl.replace(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/blob\//, 'https://raw.githubusercontent.com/$1/'));
                    const d = await r.json();
                    tpl = Array.isArray(d) ? d : (d.Items || d.achievements || []);
                } catch (_) {}
            }
            if (!userAch) await loadUserAch();
            const mine = (userAch || []).filter(a => sameGame(a, g));
            const items = tpl.map(t => ({ name: t.Name || t.name || '', desc: t.Description || t.description || '', icon: t.iconUrl || t.UrlUnlocked || t.image || '', id: String(t.achievementId || t.apiName || t.id || '').toLowerCase(), at: '' }));
            mine.forEach(u => {
                const id = String(u.achievementId || '').toLowerCase(), nm = String(u.name || '').toLowerCase();
                const hit = items.find(t => (id && t.id === id) || (nm && t.name.toLowerCase() === nm));
                if (hit) { hit.at = u.unlockedAt; if (!hit.icon) hit.icon = u.iconUrl || ''; }
                else items.push({ name: u.name || u.achievementId || 'Achievement', desc: u.description || '', icon: u.iconUrl || u.achievementIcon || '', id, at: u.unlockedAt });
            });
            const ts = a => a.at ? new Date(a.at).getTime() || 0 : -1;
            return items.sort((x, y) => (ts(y) > 0) - (ts(x) > 0) || ts(y) - ts(x));
        }
        async function openGame(g) {
            const cover = g.coverUrl ? `<img src="${esc(g.coverUrl)}" alt="" onerror="this.style.display='none'">` : `<span>${esc(getPlatformIcon(g.platform || ''))}</span>`;
            const pt = minutesOf(g);
            $('detailBody').innerHTML = `<div class="app-hero"><div class="app-cover">${cover}</div><div><h2>${esc(g.title)}</h2>
                <small>${esc(g.platform)}</small><small>⏱ Playtime: ${pt ? fmtPlaytime(pt) + (pt >= 60 ? ' ' + (pt % 60) + 'm' : '') : 'Not played yet'}</small>${g.addedAt ? `<small>Added ${esc(asDate(g.addedAt))}</small>` : ''}</div></div>
                <h2 class="app-h2">🏆 Achievements</h2><div id="detailAch"><p class="games-list-empty">Loading…</p></div>
                <h2 class="app-h2">👥 Friends who own this</h2><div id="detailFriends" class="app-list"><p class="games-list-empty">Loading…</p></div>`;
            $('gameDetail').hidden = false;
            const items = await loadGameAchievements(g);
            if ($('gameDetail').hidden) return;
            const done = items.filter(a => a.at).length;
            const achHtml = a => {
                const img = /^https:\/\//i.test(a.icon) ? `style="background-image:url('${esc(a.icon.replace(/'/g, ''))}')"` : '';
                return `<div class="app-ach ${a.at ? '' : 'locked'}"><div class="app-ach-icon" ${img}>${img ? '' : (a.at ? '🏆' : '🔒')}</div><div><b>${esc(a.name)}</b>${a.desc ? `<small>${esc(a.desc)}</small>` : ''}${a.at ? `<small>Unlocked ${esc(asDate(a.at))}</small>` : ''}</div></div>`;
            };
            if (!items.length) $('detailAch').innerHTML = empty('No achievements synced for this game yet.');
            else {
                $('detailAch').innerHTML = `<small style="color:var(--text-muted)">${done} / ${items.length} unlocked</small><div class="app-ach-progress"><div style="width:${Math.round(done / items.length * 100)}%"></div></div>` +
                    items.slice(0, 5).map(achHtml).join('') +
                    (items.length > 5 ? `<button class="btn app-more" id="achMore">View all ${items.length} achievements</button>` : '');
                if (items.length > 5) $('achMore').onclick = () => {
                    $('achSheetTitle').textContent = '🏆 ' + g.title + ' (' + done + '/' + items.length + ')';
                    $('achSheetBody').innerHTML = items.map(achHtml).join('');
                    $('achSheet').hidden = false;
                };
            }
            if (!friendsLoaded) await loadFriends();
            const owners = friends.filter(f => (friendLibs[f] || []).some(x => (x.title || '').toLowerCase() === (g.title || '').toLowerCase() && (!x.platform || !g.platform || x.platform === g.platform)));
            if ($('gameDetail').hidden) return;
            $('detailFriends').innerHTML = owners.length
                ? owners.map(f => `<div class="app-row app-friend-row" data-fr="${esc(f)}"><div class="app-cover"><span>👤</span></div><div class="app-row-info"><b>${esc(f)}</b><small>Owns this game</small></div></div>`).join('')
                : empty('None of your friends own this game.');
        }
        function renderAll() { renderHome(); renderLibrary(); renderFavs(); }

        // ── Notifications (friend requests, messages, achievements) ──
        let seenKey, friends = [], alertItems = [], friendLibs = {}, friendsLoaded = false;
        const store = (k, v) => v === undefined ? JSON.parse(localStorage.getItem(k) || 'null') : localStorage.setItem(k, JSON.stringify(v));
        function notify(title, body, url) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const o = { body, icon: 'icons/icon-192.png', data: { url: url || 'app.html' } };
            if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, o));
            else new Notification(title, o);
        }
        const nameOf = f => typeof f === 'string' ? f : (f.username || f.name || f.from || '');
        async function loadFriends() {
            try { friends = (MODE === 'demo' ? getDemoFriends(user.username) : await getFriendsGitHub(user.username)).map(nameOf).filter(Boolean); } catch (_) {}
            await Promise.all(friends.map(async f => {
                try { friendLibs[f] = MODE === 'demo' ? getDemoGameLibrary(f) : await getGameLibraryGitHub(f); } catch (_) { friendLibs[f] = []; }
            }));
            friendsLoaded = true;
            renderFriends();
        }
        function renderFriends() {
            $('friendList').innerHTML = friends.length ? friends.map(f => {
                const lib = friendLibs[f] || [];
                return `<div class="app-row app-friend-row" data-fr="${esc(f)}"><div class="app-cover"><span>👤</span></div><div class="app-row-info"><b>${esc(f)}</b><small>${lib.length} game${lib.length === 1 ? '' : 's'}</small></div><span>›</span></div>`;
            }).join('') : empty('Add friends on the site to see them here.');
        }
        async function openFriend(f) {
            const lib = friendLibs[f] || [];
            const pt = lib.reduce((n, g) => n + minutesOf(g), 0);
            $('detailBody').innerHTML = `<div class="app-hero"><div class="app-cover"><span>👤</span></div><div><h2>${esc(f)}</h2><small>🎮 ${lib.length} games</small><small>⏱ ${fmtPlaytime(pt)} played</small></div></div>
                <button class="btn app-more" id="friendChat">💬 Message</button>
                <h2 class="app-h2">Recent games</h2><div id="frGames" class="app-list"></div>
                <h2 class="app-h2">🏆 Recent achievements</h2><div id="frAch"><p class="games-list-empty">Loading…</p></div>`;
            $('gameDetail').hidden = false;
            $('friendChat').onclick = () => { $('gameDetail').hidden = true; showView('chats'); openChat(f); };
            const recent = [...lib].sort((a, b) => (b.lastPlayed || b.addedAt || '').localeCompare(a.lastPlayed || a.addedAt || '')).slice(0, 5);
            $('frGames').innerHTML = recent.length ? recent.map(g => row({ ...g, _noOpen: true })).join('') : empty('No games yet.');
            let ach = [];
            try {
                const file = MODE === 'demo' ? null : await githubRead('accounts/' + f.toLowerCase() + '/achievements.json');
                if (file && Array.isArray(file.content)) ach = file.content.filter(isUnlocked);
            } catch (_) {}
            if ($('gameDetail').hidden) return;
            ach.sort((a, b) => String(b.unlockedAt).localeCompare(String(a.unlockedAt)));
            $('frAch').innerHTML = ach.length ? `<small style="color:var(--text-muted)">${ach.length} unlocked in total</small>` + ach.slice(0, 10).map(a => {
                const ic = a.iconUrl || a.achievementIcon || '';
                const img = /^https:\/\//i.test(ic) ? `style="background-image:url('${esc(ic.replace(/'/g, ''))}')"` : '';
                return `<div class="app-ach"><div class="app-ach-icon" ${img}>${img ? '' : '🏆'}</div><div><b>${esc(a.name || a.achievementId || 'Achievement')}</b><small>${esc(a.gameTitle || '')}</small><small>Unlocked ${esc(asDate(a.unlockedAt))}</small></div></div>`;
            }).join('') : empty('No achievements to show.');
        }
        function showView(v) {
            document.querySelectorAll('.app-tabbar button').forEach(x => x.classList.toggle('active', x.dataset.view === v));
            document.querySelectorAll('.app-view').forEach(x => x.hidden = x.id !== 'view-' + v);
            window.scrollTo(0, 0);
        }
        async function fetchMsgs(f) {
            const r = MODE === 'demo' ? await getMessagesDemo(user.username, f) : await getMessagesGitHub(user.username, f);
            return r.messages || [];
        }
        async function pollAlerts(push) {
            try {
                const items = [];
                const seen = store(seenKey) || {};
                const next = { req: [], msg: {}, ach: seen.ach };
                const fresh = [];
                // friend requests
                const reqs = (MODE === 'demo' ? getDemoFriendRequests(user.username) : await getFriendRequestsGitHub(user.username)) || [];
                reqs.map(nameOf).forEach(n => {
                    items.push({ icon: '👥', t: n, s: 'sent you a friend request' });
                    next.req.push(n);
                    if (!(seen.req || []).includes(n)) fresh.push(['Friend request', n + ' sent you a friend request', 'app.html']);
                });
                // messages
                let unreadTotal = 0;
                const unread = {};
                for (const f of friends) {
                    const msgs = await fetchMsgs(f).catch(() => []);
                    const incoming = msgs.filter(m => (m.from || '').toLowerCase() !== user.username.toLowerCase());
                    const lastRead = getLastRead(user.username, f);
                    const n = incoming.filter(m => !lastRead || m.sentAt > lastRead).length;
                    unread[f] = { n, last: msgs[msgs.length - 1] };
                    unreadTotal += n;
                    next.msg[f] = incoming.length;
                    if (n && seen.msg && incoming.length > (seen.msg[f] || 0)) {
                        const m = incoming[incoming.length - 1];
                        fresh.push(['💬 ' + f, m.text, 'app.html#chats']);
                    }
                    if (n) items.push({ icon: '💬', t: f, s: n + ' unread message' + (n > 1 ? 's' : '') });
                }
                // achievements
                const total = library.reduce((n, g) => n + achOf(g), 0);
                next.ach = total;
                if (seen.ach != null && total > seen.ach) {
                    const d = total - seen.ach;
                    fresh.push(['🏆 Achievement unlocked', d + ' new achievement' + (d > 1 ? 's' : '') + ' earned', 'app.html']);
                    pushApi('/api/push/notify', { type: 'achievement', text: d + ' new achievement' + (d > 1 ? 's' : '') + ' earned' }).catch(() => {});
                    items.unshift({ icon: '🏆', t: 'Achievement unlocked', s: d + ' new achievement' + (d > 1 ? 's' : '') });
                }
                store(seenKey, next);
                alertItems = items; renderChats(unread);
                $('alertList').innerHTML = items.length ? items.map(i => `<div class="app-row"><div class="app-cover"><span>${i.icon}</span></div><div class="app-row-info"><b>${esc(i.t)}</b><small>${esc(i.s)}</small></div></div>`).join('') : empty('No new alerts.');
                const badge = $('alertBadge'); badge.hidden = !items.length; badge.textContent = items.length;
                const cb = $('chatBadge'); cb.hidden = !unreadTotal; cb.textContent = unreadTotal;
                if (push) fresh.forEach(f => notify(f[0], f[1], f[2]));
            } catch (_) {}
        }
        function renderChats(unread) {
            $('chatList').innerHTML = friends.length ? friends.map(f => {
                const u = (unread && unread[f]) || {};
                return `<div class="app-row app-chat-row" data-f="${esc(f)}"><div class="app-cover"><span>👤</span></div><div class="app-row-info"><b>${esc(f)}</b><small>${esc(u.last ? u.last.text : 'Say hi!')}</small></div>${u.n ? `<span class="app-pill">${u.n}</span>` : ''}</div>`;
            }).join('') : empty('Add friends on the site to start chatting.');
        }
        let chatFriend = null;
        async function openChat(f) {
            chatFriend = f;
            $('chatList').hidden = true; $('chatPane').hidden = false; $('chatWith').textContent = f;
            const msgs = await fetchMsgs(f).catch(() => []);
            $('chatMsgs').innerHTML = msgs.map(m => `<div class="app-bubble ${(m.from || '').toLowerCase() === user.username.toLowerCase() ? 'me' : ''}">${esc(m.text)}</div>`).join('') || empty('No messages yet.');
            $('chatMsgs').scrollTop = 1e9;
            markConversationRead(user.username, f);
            pollAlerts(false);
        }
        async function sendChat(e) {
            e.preventDefault();
            const text = $('chatInput').value.trim();
            if (!text || !chatFriend) return;
            $('chatInput').value = '';
            if (MODE === 'demo') await sendMessageDemo(user.username, chatFriend, text);
            else await sendMessageGitHub(user.username, chatFriend, text);
            pushApi('/api/push/notify', { type: 'message', toUsername: chatFriend, text }).catch(() => {});
            openChat(chatFriend);
        }
        // ── Server push (works when the app is closed) ──
        const pushBase = () => (localStorage.getItem('gameOS_pushBackendUrl') || localStorage.getItem('gameOS_devBackendUrl') || '').replace(/\/+$/, '');
        const apiTok = () => localStorage.getItem('gameOS_apiToken_' + user.username.toLowerCase());
        async function pushApi(path, body) {
            const base = pushBase(), tok = apiTok();
            if (!base || !tok) return null;
            const r = await fetch(base + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: body ? JSON.stringify(body) : undefined });
            return r.json();
        }
        function b64ToBytes(b) {
            const p = '='.repeat((4 - b.length % 4) % 4), raw = atob((b + p).replace(/-/g, '+').replace(/_/g, '/'));
            return Uint8Array.from(raw, c => c.charCodeAt(0));
        }
        async function subscribePush() {
            try {
                if (!('PushManager' in window) || Notification.permission !== 'granted' || !pushBase() || !apiTok()) return;
                const reg = await navigator.serviceWorker.ready;
                const k = await (await fetch(pushBase() + '/api/push/public-key')).json();
                if (!k.success) return;
                const sub = (await reg.pushManager.getSubscription()) ||
                    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(k.publicKey) });
                await pushApi('/api/push/subscribe', { subscription: sub.toJSON() });
            } catch (_) {}
        }
        function renderNotifBox() {
            const box = $('notifBox');
            if (!('Notification' in window)) {
                box.innerHTML = '<p>Live notifications need iOS 16.4+ with Game OS added to your Home Screen.</p>';
            } else if (Notification.permission === 'granted') {
                box.innerHTML = '<p>🔔 Live notifications are on.</p>';
            } else if (Notification.permission === 'denied') {
                box.innerHTML = '<p>Notifications are blocked. Enable them in Settings.</p>';
            } else {
                box.innerHTML = '<button class="btn" id="enableNotif">Enable notifications</button>';
                $('enableNotif').onclick = () => Notification.requestPermission().then(() => { renderNotifBox(); subscribePush(); });
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try { await modeReady; } catch (_) {}
            user = isLoggedIn() ? getCurrentUser() : null;
            if (!user) { location.replace('login.html'); return; }
            seenKey = 'gameOS_seen_alerts_' + user.username.toLowerCase();
            $('appUser').textContent = user.username;
            try {
                library = MODE === 'demo' ? getDemoGameLibrary(user.username) : await getGameLibraryGitHub(user.username);
            } catch (_) { library = []; }
            fillPlatforms(); renderAll(); loadUserAch().then(renderAll);
            if (typeof syncFavourites === 'function') syncFavourites(user.username).then(renderAll); renderNotifBox(); subscribePush();
            await loadFriends(); renderChats(); renderFriends();
            pollAlerts(false);
            $('chatList').addEventListener('click', e => { const r = e.target.closest('.app-chat-row'); if (r) openChat(r.dataset.f); });
            $('chatBack').onclick = () => { chatFriend = null; $('chatPane').hidden = true; $('chatList').hidden = false; };
            $('chatForm').addEventListener('submit', sendChat);
            setInterval(() => pollAlerts(true), 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) pollAlerts(true); });

            document.querySelectorAll('.app-tabbar button').forEach(b => b.onclick = () => showView(b.dataset.view));
            $('libSearch').addEventListener('input', renderLibrary);
            ['libPlatform', 'libSort', 'libShow'].forEach(id => $(id).addEventListener('change', renderLibrary));
            $('libGroups').addEventListener('click', e => { const c = e.target.closest('[data-plat]'); if (c) { $('libPlatform').value = c.dataset.plat; renderLibrary(); } });
            $('achSheetClose').onclick = () => { $('achSheet').hidden = true; };
            $('achSheet').addEventListener('click', e => { if (e.target === $('achSheet')) $('achSheet').hidden = true; });
            document.addEventListener('click', e => { const r = e.target.closest('.app-friend-row'); if (r) openFriend(r.dataset.fr); });
            $('detailBack').onclick = () => { $('gameDetail').hidden = true; };
            document.querySelector('.app-main').addEventListener('click', e => {
                const b = e.target.closest('.app-fav');
                if (!b) {
                    const r = e.target.closest('[data-open-t]');
                    if (r) { const g = findGame(r.dataset.openP, r.dataset.openT); if (g) openGame(g); }
                    return;
                }
                toggleFavourite(user.username, { title: b.dataset.t, coverUrl: (library.find(g => g.title === b.dataset.t && g.platform === b.dataset.p) || {}).coverUrl }, b.dataset.p);
                renderAll();
            });
        });
    })();
    </script>
</body>
</html>
